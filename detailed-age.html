<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>حاسبة العمر بالتفصيل</title>

<meta name="description" content="احسب عمرك بالتفصيل بالسنوات والأشهر والأيام باستخدام حاسبة العمر المجانية.">

<style>
body {
font-family: Arial, sans-serif;
text-align: center;
padding: 20px;
line-height: 1.8;
background: #ffffff;
}

.box {
max-width: 500px;
margin: 30px auto;
padding: 25px;
border-radius: 15px;
background: #f7f7f7;
}

input, button {
padding: 12px;
margin: 8px;
border-radius: 8px;
border: 1px solid #ccc;
font-size: 16px;
}

button {
cursor: pointer;
}

#result {
margin-top: 20px;
font-size: 18px;
font-weight: bold;
}
</style>
</head>

<body>

<h1>حاسبة العمر بالتفصيل</h1>

<p>
أدخل تاريخ ميلادك لمعرفة عمرك بالسنوات والأشهر والأيام.
</p>

<div class="box">

<input type="date" id="birthDate">

<br>

<button onclick="calculateAge()">احسب العمر</button>

<div id="result"></div>

</div>

<script>
function calculateAge() {

const birth = new Date(document.getElementById("birthDate").value);
const today = new Date();

if (isNaN(birth.getTime())) {
document.getElementById("result").innerHTML =
"اختر تاريخ الميلاد أولًا.";
return;
}

if (birth > today) {
document.getElementById("result").innerHTML =
"تاريخ الميلاد لا يمكن أن يكون في المستقبل.";
return;
}

let years = today.getFullYear() - birth.getFullYear();
let months = today.getMonth() - birth.getMonth();
let days = today.getDate() - birth.getDate();

if (days < 0) {
months--;
days += new Date(
today.getFullYear(),
today.getMonth(),
0
).getDate();
}

if (months < 0) {
years--;
months += 12;
}

document.getElementById("result").innerHTML =
"عمرك: " +
years +
" سنة، " +
months +
" شهر، " +
days +
" يوم.";
}
</script>

</body>
</html>
